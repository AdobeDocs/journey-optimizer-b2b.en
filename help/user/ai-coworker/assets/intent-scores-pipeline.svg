<svg width="100%" viewBox="0 0 624 100" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Intent scoring process</title>
  <desc>Five-stage flowchart: Engagement capture, Content extraction, Relevance scoring, Daily intent calculation, Score delivery.</desc>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box-fill { fill: #FCEBEB; stroke: #A32D2D; }
      .box-text { font-family: sans-serif; font-size: 11px; font-weight: 500; fill: #791F1F; }
      .num-circle { fill: #A32D2D; stroke: none; }
      .num-text { font-family: sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .arr { stroke: #A32D2D; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Step 1 -->
  <rect x="0" y="3" width="112" height="94" rx="8" stroke-width="0.5" class="box-fill"/>
  <circle cx="56" cy="28" r="12" class="num-circle"/>
  <text class="num-text" x="56" y="28" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="box-text" x="56" y="62" text-anchor="middle" dominant-baseline="central">Engagement</text>
  <text class="box-text" x="56" y="76" text-anchor="middle" dominant-baseline="central">capture</text>

  <line x1="112" y1="50" x2="128" y2="50" class="arr" marker-end="url(#arrow2)"/>

  <!-- Step 2 -->
  <rect x="128" y="3" width="112" height="94" rx="8" stroke-width="0.5" class="box-fill"/>
  <circle cx="184" cy="28" r="12" class="num-circle"/>
  <text class="num-text" x="184" y="28" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="box-text" x="184" y="62" text-anchor="middle" dominant-baseline="central">Content</text>
  <text class="box-text" x="184" y="76" text-anchor="middle" dominant-baseline="central">extraction</text>

  <line x1="240" y1="50" x2="256" y2="50" class="arr" marker-end="url(#arrow2)"/>

  <!-- Step 3 -->
  <rect x="256" y="3" width="112" height="94" rx="8" stroke-width="0.5" class="box-fill"/>
  <circle cx="312" cy="28" r="12" class="num-circle"/>
  <text class="num-text" x="312" y="28" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="box-text" x="312" y="62" text-anchor="middle" dominant-baseline="central">Relevance</text>
  <text class="box-text" x="312" y="76" text-anchor="middle" dominant-baseline="central">scoring</text>

  <line x1="368" y1="50" x2="384" y2="50" class="arr" marker-end="url(#arrow2)"/>

  <!-- Step 4 -->
  <rect x="384" y="3" width="122" height="94" rx="8" stroke-width="0.5" class="box-fill"/>
  <circle cx="445" cy="28" r="12" class="num-circle"/>
  <text class="num-text" x="445" y="28" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="box-text" x="445" y="62" text-anchor="middle" dominant-baseline="central">Daily intent</text>
  <text class="box-text" x="445" y="76" text-anchor="middle" dominant-baseline="central">calculation</text>

  <line x1="506" y1="50" x2="522" y2="50" class="arr" marker-end="url(#arrow2)"/>

  <!-- Step 5 -->
  <rect x="522" y="3" width="102" height="94" rx="8" stroke-width="0.5" class="box-fill"/>
  <circle cx="573" cy="28" r="12" class="num-circle"/>
  <text class="num-text" x="573" y="28" text-anchor="middle" dominant-baseline="central">5</text>
  <text class="box-text" x="573" y="62" text-anchor="middle" dominant-baseline="central">Score</text>
  <text class="box-text" x="573" y="76" text-anchor="middle" dominant-baseline="central">delivery</text>
</svg>
